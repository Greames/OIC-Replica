# Everything needed to run OIC-Replica locally or self-hosted.
#   cp .env.example .env   (set BETTER_AUTH_SECRET and SECRETS_KEY)
#   docker compose up --build
# Postgres only, for `pnpm dev`:  docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oicr
      POSTGRES_PASSWORD: oicr
      POSTGRES_DB: oicr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oicr"]
      interval: 3s
      retries: 20


  migrate:
    build: .
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: .
    environment:
      DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-}
      APP_URL: ${APP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s

  worker:
    build: .
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      APP_URL: ${APP_URL:-${BETTER_AUTH_URL:-http://localhost:3000}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
