# Everything needed to run OIC-Replica locally or self-hosted.
#   cp .env.example .env   (set BETTER_AUTH_SECRET)
#   docker compose up --build
# Customer credentials are kept in the bundled Vault (deploy/vault); set VAULT_ADDR
# and Vault credentials to use your own. OTEL_EXPORTER_OTLP_ENDPOINT turns on tracing.
# Postgres only, for `pnpm dev`:  docker compose up -d postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oicr
      POSTGRES_PASSWORD: oicr
      POSTGRES_DB: oicr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oicr"]
      interval: 3s
      retries: 20

  vault:
    image: hashicorp/vault:1.20
    entrypoint: ["/bin/sh", "/vault/init.sh"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./deploy/vault/init.sh:/vault/init.sh:ro
      - ./deploy/vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
      - vault-token:/vault/token
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/token/ready && vault status >/dev/null"]
      interval: 2s
      retries: 30

  migrate:
    build: .
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      # Migrations run as the owner, and give the application role its login.
      DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-oicr_app}
      SECRETS_BACKEND: vault
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN_FILE: /vault-token/token
      VAULT_KV_MOUNT: oicr
      SECRETS_KEY: ${SECRETS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes: ["vault-token:/vault-token:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      vault: { condition: service_healthy }

  web:
    build: .
    environment:
      # The application role: no superuser, no BYPASSRLS, so tenant isolation applies.
      DATABASE_URL: postgres://oicr_app:${APP_DB_PASSWORD:-oicr_app}@postgres:5432/oicr
      QUEUE_DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      STREAM_URL: http://stream:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SECRETS_BACKEND: vault
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN_FILE: /vault-token/token
      VAULT_KV_MOUNT: oicr
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SECRETS_KEY: ${SECRETS_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_EFFORT: ${AI_EFFORT:-}
      APP_URL: ${APP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes: ["vault-token:/vault-token:ro"]
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s

  # The stream engine: runs HTTP-triggered integrations (/t/...), apart from the web app.
  stream:
    build: .
    command: ["node", "apps/stream/dist/main.js"]
    environment:
      DATABASE_URL: postgres://oicr_app:${APP_DB_PASSWORD:-oicr_app}@postgres:5432/oicr
      QUEUE_DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      SECRETS_BACKEND: vault
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN_FILE: /vault-token/token
      VAULT_KV_MOUNT: oicr
      SECRETS_KEY: ${SECRETS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      APP_URL: ${APP_URL:-${BETTER_AUTH_URL:-http://localhost:3000}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STREAM_PORT: "3001"
    volumes: ["vault-token:/vault-token:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/readyz"]
      interval: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      DATABASE_URL: postgres://oicr_app:${APP_DB_PASSWORD:-oicr_app}@postgres:5432/oicr
      QUEUE_DATABASE_URL: postgres://oicr:oicr@postgres:5432/oicr
      SECRETS_BACKEND: vault
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN_FILE: /vault-token/token
      VAULT_KV_MOUNT: oicr
      SECRETS_KEY: ${SECRETS_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      APP_URL: ${APP_URL:-${BETTER_AUTH_URL:-http://localhost:3000}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes: ["vault-token:/vault-token:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  vault-data:
  vault-token:
